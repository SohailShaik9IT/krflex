<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Activity & Logs - KRFLEX</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="app"></div>

<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script>
  requireAdminPage();

  function render() {
    document.getElementById('app').innerHTML = `
      <div class="app-shell">
        ${renderSidebar('activity-logs.html')}
        <div class="main-content">
          <h1>📝 Activity &amp; Logs</h1>

          <div class="panel">
            <h3>Order Status Summary</h3>
            <div class="metric-row" id="summaryRow"><p>Loading...</p></div>
          </div>

          <div class="panel">
            <h3>Recent Activity</h3>
            <p style="color:var(--muted); font-size:0.85rem; margin-top:-8px;">
              Order tracker actions only (order created / status changes).
            </p>
            <div class="form-grid" style="margin-bottom:14px;">
              <div>
                <label>Search by customer name</label>
                <input id="searchName" placeholder="Customer name" />
              </div>
              <div>
                <label>Search by mobile number</label>
                <input id="searchMobile" placeholder="Mobile number" />
              </div>
            </div>
            <div class="form-actions" style="margin-top:0; margin-bottom:16px;">
              <button type="button" id="searchBtn">Search</button>
              <button type="button" id="clearSearchBtn" class="btn-secondary">Clear</button>
            </div>
            <table class="data-table">
              <thead>
                <tr>
                  <th>Time</th>
                  <th>Action</th>
                  <th>Username</th>
                  <th>Employee Name</th>
                  <th>Customer</th>
                  <th>Mobile</th>
                  <th>Details</th>
                </tr>
              </thead>
              <tbody id="logRows"><tr><td colspan="7">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    `;

    document.getElementById('searchBtn').addEventListener('click', () => loadLogs());
    document.getElementById('clearSearchBtn').addEventListener('click', () => {
      document.getElementById('searchName').value = '';
      document.getElementById('searchMobile').value = '';
      loadLogs();
    });
    document.getElementById('searchName').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadLogs();
    });
    document.getElementById('searchMobile').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadLogs();
    });

    loadSummary();
    loadLogs();
  }

  async function loadSummary() {
    try {
      const summary = await KRFlexAPI.get('/activity-logs/order-status-summary');
      const el = document.getElementById('summaryRow');
      el.innerHTML = summary.length
        ? summary.map(s => `<div class="metric-card"><div class="label">${s.status}</div><div class="value">${s.count}</div></div>`).join('')
        : '<p>No orders yet.</p>';
    } catch (err) {
      showToast(err.message, true);
    }
  }

  async function loadLogs() {
    const name = document.getElementById('searchName').value.trim();
    const mobile = document.getElementById('searchMobile').value.trim();
    const params = {};
    if (name) params.name = name;
    if (mobile) params.mobile = mobile;

    try {
      const logs = await KRFlexAPI.get('/activity-logs', params);
      const tbody = document.getElementById('logRows');
      if (!logs.length) {
        tbody.innerHTML = '<tr><td colspan="7">No order tracker activity found.</td></tr>';
        return;
      }
      tbody.innerHTML = logs.map(l => `
        <tr>
          <td>${epochToDateTimeStr(l.logged_at)}</td>
          <td>${l.action}</td>
          <td>${l.username || '-'}</td>
          <td>${l.employee_name || '-'}</td>
          <td>${l.customer_name || '-'}</td>
          <td>${l.customer_mobile || '-'}</td>
          <td>${l.details || '-'}</td>
        </tr>
      `).join('');
    } catch (err) {
      showToast(err.message, true);
    }
  }

  render();
</script>
</body>
</html>
